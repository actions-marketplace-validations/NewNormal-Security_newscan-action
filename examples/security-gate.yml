# Gate a deploy on a NewScan security scan and publish findings to GitHub code scanning.
# Copy into .github/workflows/ of the repo you want to protect.
name: security-gate
on:
  deployment_status: {}          # runs after a deployment reports success (has the target URL)

permissions:
  security-events: write         # for upload-sarif (code scanning)
  contents: read

jobs:
  scan:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: NewNormal-Security/newscan-action@v1
        with:
          target: ${{ github.event.deployment_status.target_url }}
          scan-mode: api
          profile: quick          # deterministic, no provider key needed
          fail-on: high           # fail the job on any High+ finding
          license: ${{ secrets.NEWSCAN_LICENSE }}

      # Always keep the SARIF as a downloadable artifact (works on any repo).
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: newscan-sarif
          path: newscan.sarif

      # Surface findings in the Security tab. Code scanning is free on public repos; on PRIVATE
      # repos it needs GitHub Advanced Security. continue-on-error keeps the build from going red
      # where code scanning isn't enabled — the scan gate already fails the job on findings.
      - if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: newscan.sarif
